name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # Runs every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Erliandikasyahputraa  # Replace with your GitHub username
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8A2BE2
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8A2BE2&color_dots=#161b22,#1f3460,#2b5093,#5274d1,#bb9af7
            dist/github-contribution-grid-snake.gif?color_snake=#8A2BE2
      
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
