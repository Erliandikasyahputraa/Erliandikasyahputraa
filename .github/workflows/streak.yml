name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          options: "user=erliandikasyahputraa&theme=tokyonight-duo&hide_border=true&type=svg"
          path: dist/streak.svg

      - name: Commit and push streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update streak stats" && git push)
