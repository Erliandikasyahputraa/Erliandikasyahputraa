name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak stats SVG
        run: |
          mkdir -p dist
          curl -s --retry 3 --retry-delay 5 \
            "https://streak-stats.demolab.com/?user=erliandikasyahputraa&theme=blood-dark&hide_border=true" \
            -o dist/streak.svg
          if grep -q "<svg" dist/streak.svg; then
            echo "Streak SVG fetched successfully"
          else
            echo "Failed to fetch a valid SVG, keeping previous version"
            exit 0
          fi

      - name: Commit and push streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/streak.svg
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update streak stats"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in streak SVG"
          fi
