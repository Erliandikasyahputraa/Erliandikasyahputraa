name: Generate Activity Graph

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch activity graph SVG
        run: |
          mkdir -p dist
          HTTP_STATUS=$(curl -s -o dist/activity-graph-tmp.svg -w "%{http_code}" \
            "https://graph-readme.vercel.app/graph?username=Erliandikasyahputraa&bg_color=161b22&color=f87171&line=ef4444&point=ffffff&area=true&area_color=991b1b&title_color=ff4d4d&hide_border=true")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] && grep -q "<svg" dist/activity-graph-tmp.svg; then
            mv dist/activity-graph-tmp.svg dist/activity-graph.svg
            echo "Activity graph SVG fetched successfully"
          else
            rm -f dist/activity-graph-tmp.svg
            echo "Service unavailable (HTTP $HTTP_STATUS) — skipping update"
            exit 0
          fi

      - name: Commit and push activity graph SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/activity-graph.svg 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update activity graph"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in activity graph SVG"
          fi
